name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Check linting
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync black --check .

      - name: Check import sorting
        run: uv run --no-sync isort --check-only .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Check types
        run: uv run --no-sync mypy src/researcher

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests with coverage
        run: >
          uv run --no-sync python -m pytest -v
          --cov=researcher
          --cov-report=term-missing
          --cov-fail-under=60

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Build test image
        run: docker build --target test -t research-assistant:test .

      - name: Run tests inside Docker
        run: docker run --rm research-assistant:test

      - name: Build runtime image
        run: docker build --target runtime -t research-assistant:runtime .

      - name: Check installed packages
        run: >
          docker run --rm --network none research-assistant:runtime
          python -c "import ai; import researcher"

      - name: Run offline demo
        run: >
          docker run --rm --network none research-assistant:runtime
          python demo_ai.py --offline --limit 5
