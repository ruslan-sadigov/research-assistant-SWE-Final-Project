name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Check linting
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync black --check .

      - name: Check import sorting
        run: uv run --no-sync isort --check-only .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Check types
        run: uv run --no-sync mypy src/researcher

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests with coverage
        run: >
          uv run --no-sync python -m pytest -v
          --cov=researcher
          --cov-report=term-missing
          --cov-fail-under=60

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Build test image
        run: docker build --target test -t research-assistant:test .

      - name: Run tests inside Docker
        run: docker run --rm research-assistant:test

      - name: Build runtime image
        run: docker build --target runtime -t research-assistant:runtime .

      - name: Check installed packages
        run: >
          docker run --rm --network none --entrypoint python research-assistant:runtime
          -c "import ai; import researcher; from google import genai"

      - name: Check CLI help
        run: docker run --rm --network none research-assistant:runtime

      - name: Verify offline CLI and cache persistence
        run: |
          docker volume create research-assistant-ci-cache
          trap 'docker volume rm research-assistant-ci-cache' EXIT
          for mode in populate reuse; do
            docker run --rm --network none --entrypoint python \
              --mount type=volume,source=research-assistant-ci-cache,target=/home/appuser/.cache/research-assistant \
              --mount "type=bind,source=$PWD/tests/docker_smoke.py,target=/tmp/docker_smoke.py,readonly" \
              research-assistant:runtime /tmp/docker_smoke.py "$mode"
          done
