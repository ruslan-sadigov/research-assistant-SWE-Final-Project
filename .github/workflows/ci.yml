name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Check linting
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync black --check .

      - name: Check import sorting
        run: uv run --no-sync isort --check-only .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Check types
        run: uv run --no-sync mypy src/researcher

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests with coverage
        run: >
          uv run --no-sync python -m pytest -v
          --cov=researcher
          --cov-report=term-missing
          --cov-fail-under=60

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Build test image
        run: docker build --target test -t research-assistant:test .

      - name: Run tests inside Docker
        run: docker run --rm research-assistant:test

      - name: Build runtime image
        run: docker build --target runtime -t research-assistant:runtime .

      - name: Check installed packages
        run: >
          docker run --rm --network none --entrypoint python research-assistant:runtime
          -c "import ai; import researcher; from google import genai"

      - name: Check CLI help
        run: docker run --rm --network none research-assistant:runtime

      - name: Verify offline CLI and cache persistence
        run: |
          docker volume create research-assistant-ci-cache
          trap 'docker volume rm research-assistant-ci-cache' EXIT
          for mode in populate reuse; do
            docker run --rm --network none --entrypoint python \
              --mount type=volume,source=research-assistant-ci-cache,target=/home/appuser/.cache/research-assistant \
              --mount "type=bind,source=$PWD/tests/docker_smoke.py,target=/tmp/docker_smoke.py,readonly" \
              research-assistant:runtime /tmp/docker_smoke.py "$mode"
          done

  compose:
    name: compose
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      # No real API keys are available in CI; placeholder values from
      # .env.example are enough to boot both containers. This job only
      # checks that the stack starts and the two services can reach each
      # other, not that a real research question succeeds end to end.
      - name: Prepare placeholder .env
        run: cp .env.example .env

      - name: Build and start the compose stack
        run: docker compose up --build -d

      - name: Wait for the API to become reachable
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/docs > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "API never became reachable" >&2
          exit 1

      - name: Wait for the Streamlit frontend to become reachable
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8501 > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "Frontend never became reachable" >&2
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down --volumes
