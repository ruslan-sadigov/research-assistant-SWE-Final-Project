[project]
name = "research-assistant"
version = "0.1.0"
requires-python = ">=3.12, <3.13"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.23.0",
    "httpx>=0.27",
    "numpy>=1.24",
    "pydantic>=2.7",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=9.0.1",
    "mypy>=2.3.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[tool.black]
line-length = 100
target-version = ["py312"]
# Preserve the instructor-provided AI module and smoke tests.
force-exclude = '(^|/)(ai/|tests/test_ai_smoke\.py$)'

[tool.isort]
profile = "black"
line_length = 100
py_version = 312
known_first_party = ["ai", "researcher"]
extend_skip = ["ai", "tests/test_ai_smoke.py"]
filter_files = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["ai", "tests/test_ai_smoke.py"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# Keep type information from the supplied AI module without reporting errors
# in instructor-owned implementation files that this project must not edit.
[[tool.mypy.overrides]]
module = ["ai", "ai.*"]
ignore_errors = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/researcher", "ai"]
