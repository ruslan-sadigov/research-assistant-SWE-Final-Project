services:
  api:
    build:
      context: .
      target: api
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - research-cache:/home/appuser/.cache/research-assistant
    networks:
      - research-net

  frontend:
    build:
      context: ./streamlit_app
    environment:
      RESEARCH_API_URL: http://api:8000/ask
    ports:
      - "8501:8501"
    depends_on:
      - api
    networks:
      - research-net

networks:
  research-net:
    driver: bridge

volumes:
  research-cache:
